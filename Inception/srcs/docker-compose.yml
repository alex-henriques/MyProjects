services:
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets:
      - db_pass
      - db_root_pass
    volumes: 
      - db_data:/var/lib/mysql
    networks:
      - inception_network
  
  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - db_pass
      - db_root_pass
      - credentials
    depends_on: #tells compose to start mariadb before wordpress. this only controls start order
      - mariadb
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network
  
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    depends_on: 
      - wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/alehenri/data/mysql
  
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind # 'o' stands for options, it's a mount option passed to the Linux kernel when Docker creates the bind mount
      device: /home/alehenri/data/wordpress

networks:
  inception_network:
    driver: bridge

secrets:
  db_pass:
    file: ../secrets/db_pass.txt
  db_root_pass:
    file: ../secrets/db_root_pass.txt
  credentials:
    file: ../secrets/credentials.txt
